<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — MODUL.HAUS | Модульные дома и бани</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #f7f6f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .profile-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .profile-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      border: 1px solid #e8e6df;
      margin-bottom: 32px;
    }
    .profile-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .profile-user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(245, 162, 10, 0.4);
    }
    .profile-name {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 4px;
      font-family: var(--font-heading);
    }
    .profile-contact {
      font-size: 14px;
      color: #666;
    }

    /* ORDER CARD */
    .order-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      border: 1px solid #e8e6df;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }
    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0eee8;
      padding-bottom: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .order-num {
      font-size: 18px;
      font-weight: 800;
      color: #1c1d1f;
    }
    .order-date {
      font-size: 13px;
      color: #777;
    }
    .order-price {
      font-size: 22px;
      font-weight: 850;
      color: var(--accent);
      font-family: var(--font-heading);
    }

    /* STATUS STEPPER */
    .stepper-container {
      margin: 24px 0 28px;
      padding: 20px;
      background: #faf9f6;
      border-radius: 16px;
      border: 1px solid #eceae3;
    }
    .stepper-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 16px;
    }
    .stepper-steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      position: relative;
      gap: 8px;
    }
    @media (max-width: 800px) {
      .stepper-steps {
        grid-template-columns: 1fr;
        gap: 14px;
      }
    }
    .stepper-step {
      text-align: center;
      position: relative;
    }
    @media (max-width: 800px) {
      .stepper-step {
        display: flex;
        align-items: center;
        text-align: left;
        gap: 12px;
      }
    }
    .step-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e2e0d8;
      color: #777;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      margin: 0 auto 8px;
      transition: all 0.3s;
    }
    @media (max-width: 800px) {
      .step-circle {
        margin: 0;
        flex-shrink: 0;
      }
    }
    .stepper-step.is-done .step-circle {
      background: #27ae60;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(39, 174, 96, 0.3);
    }
    .stepper-step.is-current .step-circle {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(245, 162, 10, 0.45);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 162, 10, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(245, 162, 10, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 162, 10, 0); }
    }
    .step-label {
      font-size: 13px;
      font-weight: 700;
      color: #444;
      line-height: 1.3;
    }
    .step-sub {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }
    .stepper-step.is-current .step-label {
      color: var(--accent);
    }

    /* ITEMS LIST */
    .order-items-list {
      margin-top: 20px;
    }
    .order-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed #eee;
    }
    .order-item-info strong {
      font-size: 15px;
      display: block;
      margin-bottom: 4px;
    }
    .order-item-details-pill {
      font-size: 12px;
      color: #666;
    }

    /* AUTH MODAL TABS */
    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }
    .auth-tab-btn {
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 700;
      color: #888;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .auth-tab-btn.is-active {
      color: #1c1d1f;
      background: #f0eee8;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner container">
      <a href="/" class="site-logo">
        <span class="logo-bold">MODUL.HAUS</span>
      </a>

      <nav class="main-nav" aria-label="Основное меню">
        <a href="/houses.html" class="nav-link">Дома</a>
        <a href="/saunas.html" class="nav-link">Бани</a>
        <a href="/#popular" class="nav-link">Популярное</a>
        <a href="/#lead-form" class="nav-link">Контакты</a>
      </nav>

      <div class="header-actions">
        <a href="tel:88006003344" class="phone-link">8 (800) 600-33-44</a>
        <a href="/profile.html" class="profile-pill is-active" style="display: flex; align-items: center; gap: 8px; background: #fff; padding: 8px 16px; border-radius: 999px; text-decoration: none; color: #1c1d1f; font-weight: 700; font-size: 14px; border: 1.5px solid #e0ded6;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span id="navUserLabel">Кабинет</span>
        </a>
        <button type="button" class="cart-trigger-pill" data-cart-trigger aria-label="Корзина">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span>Корзина</span>
          <span class="cart-badge" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="profile-container">
    <!-- NOT LOGGED IN STATE -->
    <div id="authRequiredCard" class="profile-card" style="display: none; max-width: 480px; margin: 40px auto; text-align: center;">
      <h2 style="margin: 0 0 8px; font-size: 24px;">Вход в личный кабинет</h2>
      <p style="font-size: 14px; color: #666; margin: 0 0 24px;">
        Войдите или зарегистрируйтесь, чтобы отслеживать производство и доставку вашего дома
      </p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn is-active" id="tabLoginBtn">Вход</button>
        <button type="button" class="auth-tab-btn" id="tabRegisterBtn">Регистрация</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="cabinetLoginForm">
        <div class="form-group" style="text-align: left; margin-bottom: 14px;">
          <label style="font-size: 13px; font-weight: 700;">Телефон или Email</label>
          <input type="text" name="login" class="lead-input-pill" style="width: 100%; box-sizing: border-box; border: 1px solid #dcdad4; padding: 12px 16px; border-radius: 12px;" placeholder="+7 (999) 000-00-00 или email" required>
        </div>
        <div class="form-group" style="text-align: left; margin-bottom: 20px;">
          <label style="font-size: 13px; font-weight: 700;">Пароль</label>
          <input type="password" name="password" class="lead-input-pill" style="width: 100%; box-sizing: border-box; border: 1px solid #dcdad4; padding: 12px 16px; border-radius: 12px;" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-hero-orange" style="width: 100%; padding: 14px;">Войти в кабинет</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="cabinetRegisterForm" style="display: none;">
        <div class="form-group" style="text-align: left; margin-bottom: 12px;">
          <label style="font-size: 13px; font-weight: 700;">Ваше имя</label>
          <input type="text" name="name" class="lead-input-pill" style="width: 100%; box-sizing: border-box; border: 1px solid #dcdad4; padding: 12px 16px; border-radius: 12px;" placeholder="Иван Иванов" required>
        </div>
        <div class="form-group" style="text-align: left; margin-bottom: 12px;">
          <label style="font-size: 13px; font-weight: 700;">Номер телефона</label>
          <input type="tel" name="phone" id="regPhoneInput" class="lead-input-pill" style="width: 100%; box-sizing: border-box; border: 1px solid #dcdad4; padding: 12px 16px; border-radius: 12px;" placeholder="+7 (999) 000-00-00" required>
        </div>
        <div class="form-group" style="text-align: left; margin-bottom: 12px;">
          <label style="font-size: 13px; font-weight: 700;">Email (необязательно)</label>
          <input type="email" name="email" class="lead-input-pill" style="width: 100%; box-sizing: border-box; border: 1px solid #dcdad4; padding: 12px 16px; border-radius: 12px;" placeholder="mail@example.com">
        </div>
        <div class="form-group" style="text-align: left; margin-bottom: 20px;">
          <label style="font-size: 13px; font-weight: 700;">Придумайте пароль</label>
          <input type="password" name="password" class="lead-input-pill" style="width: 100%; box-sizing: border-box; border: 1px solid #dcdad4; padding: 12px 16px; border-radius: 12px;" placeholder="Минимум 6 символов" minlength="6" required>
        </div>
        <button type="submit" class="btn-hero-orange" style="width: 100%; padding: 14px;">Зарегистрироваться</button>
      </form>
    </div>

    <!-- LOGGED IN DASHBOARD -->
    <div id="cabinetDashboard" style="display: none;">
      <!-- USER CARD -->
      <section class="profile-card">
        <div class="profile-header-row">
          <div class="profile-user-info">
            <div class="profile-avatar" id="userAvatar">И</div>
            <div>
              <h1 class="profile-name" id="userNameDisplay">Клиент</h1>
              <div class="profile-contact" id="userContactDisplay">+7 (000) 000-00-00</div>
            </div>
          </div>

          <div style="display: flex; gap: 12px;">
            <button type="button" id="logoutBtn" style="background: none; border: 1.5px solid #e0ded6; padding: 10px 18px; border-radius: 12px; cursor: pointer; font-weight: 700; color: #555;">
              Выйти
            </button>
          </div>
        </div>
      </section>

      <!-- ORDERS LIST -->
      <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="margin: 0; font-size: 22px; font-family: var(--font-heading);">История заказов и статус производства</h2>
          <a href="/houses.html" class="btn-hero-orange" style="font-size: 14px; padding: 10px 20px;">+ Выбрать новый дом</a>
        </div>

        <div id="ordersContainer">
          <!-- Filled by JS -->
        </div>
      </section>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    const STAGE_STEPS = [
      { key: 'NEW', title: 'Заказ оформлен', desc: 'Принят в обработку' },
      { key: 'PAID', title: 'Оплачен', desc: 'Предоплата получена' },
      { key: 'IN_PRODUCTION', title: 'В производстве', desc: 'Дом подготавливается' },
      { key: 'DELIVERING', title: 'Доставляется', desc: 'Дом едет к вам' },
      { key: 'COMPLETED', title: 'Исполнен', desc: 'Сборка завершена' }
    ];

    function getStageIndex(status) {
      if (status === 'PAID') return 1;
      if (status === 'IN_PRODUCTION') return 2;
      if (status === 'DELIVERING') return 3;
      if (status === 'COMPLETED') return 4;
      return 0; // NEW
    }

    let token = localStorage.getItem('user_token');

    // Phone mask
    const phoneInput = document.getElementById('regPhoneInput');
    if (phoneInput) {
      phoneInput.addEventListener('input', function() {
        let v = this.value.replace(/\D/g, '');
        if (v.startsWith('7') || v.startsWith('8')) v = v.substring(1);
        v = v.substring(0, 10);
        let formatted = '+7 ';
        if (v.length > 0) formatted += '(' + v.substring(0, 3);
        if (v.length >= 3) formatted += ') ' + v.substring(3, 6);
        if (v.length >= 6) formatted += '-' + v.substring(6, 8);
        if (v.length >= 8) formatted += '-' + v.substring(8, 10);
        this.value = formatted;
      });
    }

    // Tab switcher
    document.getElementById('tabLoginBtn').addEventListener('click', () => {
      document.getElementById('tabLoginBtn').classList.add('is-active');
      document.getElementById('tabRegisterBtn').classList.remove('is-active');
      document.getElementById('cabinetLoginForm').style.display = 'block';
      document.getElementById('cabinetRegisterForm').style.display = 'none';
    });
    document.getElementById('tabRegisterBtn').addEventListener('click', () => {
      document.getElementById('tabRegisterBtn').classList.add('is-active');
      document.getElementById('tabLoginBtn').classList.remove('is-active');
      document.getElementById('cabinetRegisterForm').style.display = 'block';
      document.getElementById('cabinetLoginForm').style.display = 'none';
    });

    // Login submit
    document.getElementById('cabinetLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Вход...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: form.login.value,
            password: form.password.value
          })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('user_token', data.token);
          localStorage.setItem('user_data', JSON.stringify(data.user));
          checkAuthAndRender();
        } else {
          alert(data.error || 'Ошибка входа');
          btn.disabled = false;
          btn.textContent = 'Войти в кабинет';
        }
      } catch (err) {
        alert('Ошибка связи с сервером');
        btn.disabled = false;
        btn.textContent = 'Войти в кабинет';
      }
    });

    // Register submit
    document.getElementById('cabinetRegisterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Регистрация...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: form.name.value,
            phone: form.phone.value,
            email: form.email.value,
            password: form.password.value
          })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('user_token', data.token);
          localStorage.setItem('user_data', JSON.stringify(data.user));
          checkAuthAndRender();
        } else {
          alert(data.error || 'Ошибка регистрации');
          btn.disabled = false;
          btn.textContent = 'Зарегистрироваться';
        }
      } catch (err) {
        alert('Ошибка связи с сервером');
        btn.disabled = false;
        btn.textContent = 'Зарегистрироваться';
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('user_token');
      localStorage.removeItem('user_data');
      checkAuthAndRender();
    });

    async function checkAuthAndRender() {
      token = localStorage.getItem('user_token');
      if (!token) {
        document.getElementById('authRequiredCard').style.display = 'block';
        document.getElementById('cabinetDashboard').style.display = 'none';
        document.getElementById('navUserLabel').textContent = 'Вход';
        return;
      }

      try {
        const meRes = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!meRes.ok) {
          localStorage.removeItem('user_token');
          checkAuthAndRender();
          return;
        }

        const { user } = await meRes.json();
        document.getElementById('authRequiredCard').style.display = 'none';
        document.getElementById('cabinetDashboard').style.display = 'block';
        document.getElementById('userNameDisplay').textContent = user.name || 'Пользователь';
        document.getElementById('userContactDisplay').textContent = [user.phone, user.email].filter(Boolean).join(' • ');
        document.getElementById('userAvatar').textContent = (user.name || user.email || 'К').charAt(0).toUpperCase();
        document.getElementById('navUserLabel').textContent = user.name ? user.name.split(' ')[0] : 'Кабинет';

        loadUserOrders();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadUserOrders() {
      const ordersContainer = document.getElementById('ordersContainer');
      ordersContainer.innerHTML = '<div style="padding: 30px; text-align: center; color: #888;">Загружаем ваши заказы...</div>';

      try {
        const res = await fetch('/api/auth/my-orders', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const { orders } = await res.json();

        if (!orders || orders.length === 0) {
          ordersContainer.innerHTML = `
            <div class="profile-card" style="text-align: center; padding: 48px 24px;">
              <span style="font-size: 40px; display: block; margin-bottom: 12px;">🏠</span>
              <h3 style="margin: 0 0 8px;">У вас пока нет оформленных заказов</h3>
              <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
                Соберите модульный дом или баню вашей мечты в интерактивном конфигураторе
              </p>
              <a href="/houses.html" class="btn-hero-orange">Перейти в конфигуратор</a>
            </div>
          `;
          return;
        }

        ordersContainer.innerHTML = orders.map(order => {
          const currentStageIdx = getStageIndex(order.status);
          const isPaid = order.payment_status === 'PAID';

          const stepperHtml = `
            <div class="stepper-container">
              <div class="stepper-title">Статус исполнения заказа</div>
              <div class="stepper-steps">
                ${STAGE_STEPS.map((st, i) => {
                  let cls = '';
                  if (i < currentStageIdx) cls = 'is-done';
                  else if (i === currentStageIdx) cls = 'is-current';

                  return `
                    <div class="stepper-step ${cls}">
                      <div class="step-circle">${i < currentStageIdx ? '✓' : (i + 1)}</div>
                      <div>
                        <div class="step-label">${st.title}</div>
                        <div class="step-sub">${st.desc}</div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;

          const itemsHtml = (order.items || []).map(it => {
            const detailsList = it.details ? Object.entries(it.details).map(([k,v]) => `${k}: ${v}`).join(' • ') : '';
            return `
              <div class="order-item-row">
                <div class="order-item-info">
                  <strong>${it.title}</strong>
                  <div class="order-item-details-pill">${detailsList}</div>
                </div>
                <div style="font-weight: 700; white-space: nowrap;">
                  ${new Intl.NumberFormat('ru-RU').format(it.price * (it.quantity || 1))} ₽
                </div>
              </div>
            `;
          }).join('');

          return `
            <div class="order-card">
              <div class="order-head">
                <div>
                  <div class="order-num">Заказ ${order.order_number}</div>
                  <div class="order-date">${new Date(order.created_at).toLocaleString('ru-RU')}</div>
                </div>
                <div style="text-align: right;">
                  <div class="order-price">${new Intl.NumberFormat('ru-RU').format(order.total_price)} ₽</div>
                  <div style="font-size: 13px; font-weight: 700; color: ${isPaid ? '#27ae60' : '#e67e22'};">
                    ${isPaid ? '✓ Оплачен' : 'Ожидает оплаты'}
                  </div>
                </div>
              </div>

              ${stepperHtml}

              <div class="order-items-list">
                ${itemsHtml}
              </div>

              ${!isPaid && order.total_price > 0 ? `
                <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid #f0eee8; display: flex; justify-content: flex-end;">
                  <a href="/payment.html?orderId=${order.id}" class="btn-hero-orange" style="font-size: 14px; padding: 12px 24px;">
                    Оплатить заказ онлайн
                  </a>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        ordersContainer.innerHTML = `<div style="color: red; padding: 20px;">Ошибка загрузки заказов: ${err.message}</div>`;
      }
    }

    checkAuthAndRender();
  </script>
</body>
</html>
